name: 台股每日量化掃描與推播

on:
  schedule:
    # 這裡使用的是 UTC 時間 (比台灣時間慢 8 小時)
    # 10:00 UTC = 18:00 台灣時間
    # 1-5 代表星期一到星期五 (台股交易日)
    - cron: '0 10 * * 1-5'
  
  workflow_dispatch: # 加入這行，允許我們隨時手動點擊按鈕測試

jobs:
  run-scanner:
    runs-on: ubuntu-latest # 使用 GitHub 免費提供的 Linux 伺服器

    steps:
    - name: 1. 下載你的程式碼
      uses: actions/checkout@v3

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 安裝所需套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 執行量化選股與推播
      env:
        # 把剛剛鎖在保險箱的密碼，拿出來給 Python 程式使用
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python discord_bot.py
